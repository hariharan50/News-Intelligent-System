[project]
name = "nis-backend"
version = "0.1.0"
description = "News Intelligence System: API, pipeline workers and scheduler"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.41",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sentry-sdk>=2.71.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the app's engine and Redis pools are module-level.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests quote real headlines verbatim as fixtures.
"tests/*" = ["E501"]
