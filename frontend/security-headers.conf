# Security headers for every response. Included in each location that sets its own
# add_header, because nginx drops server-level add_header lines in such locations.
#
# The content security policy allows only our own scripts, plus Razorpay Checkout
# (script, its iframe, its API calls). Inline styles are allowed for React style props.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; form-action 'self' https://api.razorpay.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\")" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
